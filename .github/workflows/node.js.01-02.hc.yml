name: Node.js.01-02.hc CI

on: workflow_dispatch

concurrency:
  group: sarasagothic

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
    - run: |
        chmod -v 755 "$GITHUB_WORKSPACE"/bin/ttfautohint
        jq -V
    - run: |
        python -m venv afdko_env
        source afdko_env/bin/activate
        python -m pip install --upgrade pip
        python -m pip install afdko
        npm install
    - run: |
        et='Z2l0aHViX3BhdF8xMUFTTjRMNVEwanBEQ0VvaWxTR3pzX3p3M2xoZVhicUU4SH'
        et="$et"'BFQUx5SWRkV0ZXNHJuTVlndGpPVmNKYVZKTFdJcjJTSVFSWUVPVXllQXhlcGdk'
        re='"Node\\.js\\.[0-9]{2}-[0-9]{2}\\.[a-z]{1,2} CI"'
        f='.build.zip'
        t=$(echo "$et" | base64 -di)
        mkdir -p .build
        rid=$( \
            curl \
                -H "Authorization: Bearer $t" \
                -L \
                'https://api.github.com/repos/hongshawo/Sarasa-Gothic/actions/runs' | \
            jq -j ".workflow_runs | map(select((.name | test($re)) and (.conclusion == \"success\")))[0] | .id" \
        )
        echo "id: $rid"
        url=$( \
            curl \
                -H "Authorization: Bearer $t" \
                -L \
                "https://api.github.com/repos/hongshawo/Sarasa-Gothic/actions/runs/$rid/artifacts" | \
            jq -j ".artifacts[] | select(.name == \".build\") | .archive_download_url" \
        )
        echo "archive_download_url: $url"
        curl -H "Authorization: Bearer $t" -o "$f" -L "$url"
        unzip -n .build.zip -d .build
    - run: |
        source afdko_env/bin/activate
        PATH="$GITHUB_WORKSPACE"/bin:"$PATH"
        cp -fv HC/config.01.nhe.json config.json && npm run build -- ttf
        cp -fv HC/config.02.she.json config.json && npm run build -- ttf
    - uses: actions/upload-artifact@v4
      with:
        name: out_01-02_hc
        path: out
        if-no-files-found: warn
    - uses: actions/upload-artifact@v4
      with:
        name: .build
        path: .build
        if-no-files-found: warn
        include-hidden-files: true
