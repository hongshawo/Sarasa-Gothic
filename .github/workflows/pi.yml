name: pi CI

on: workflow_dispatch

jobs:
  build:

    runs-on: ubuntu-22.04
    # runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
    - run: |
        echo '<cpuinfo>'; cat /proc/cpuinfo
        echo '<top>'; top -n 1 -b
        echo '<disk space usage>'; df -h
        echo '<pwd>'; pwd
        echo '<ls>'; ls -aFl
        echo '<set>'; set

        PATH="$GITHUB_WORKSPACE"/bin:"$PATH"
        chmod -v 755 "$GITHUB_WORKSPACE"/bin/ttfautohint
        chmod -v 755 "$GITHUB_WORKSPACE"/bin/7zz
        echo '<Node.js>'; type -a node; node -v
        echo '<ttfautohint>'; type -a ttfautohint; ttfautohint -V
        echo '<jq>'; type -a jq; jq -V
        echo '<7-Zip>'; type -a 7zz; 7zz
        
        echo '<pi>'; time { echo -e 'scale=5000\n4*a(1)' | BC_LINE_LENGTH=100 bc -ql; }
