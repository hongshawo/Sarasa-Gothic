name: pack CI

on: workflow_dispatch

env:
  SV: 0.1.0.35.0

jobs:
  build:

    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: |
        chmod -v 755 "$GITHUB_WORKSPACE"/bin/7zz
        echo '<pwd>'; pwd
        echo '<ls>'; ls -aFl
    - run: |
        t="${{ secrets.F_TOKEN }}"
        rid=( \
            19620825274 19622871064 19623958833 19625509529 19636388956 \
            19624018709 19626330618 19631052860 19632859347 19652125869 \
            19654453352 19655414530 19656316300 19657541391 19659118917 \
            19662786364 19663507757 19664319149 19665217918 19666324571 \
            19667123974 19668520344 19669969431 19671600044 19688140284 \
            19688147485 19690632018 19691602812 19692694372 19693019784 \
        )
        re='"out_[0-9]{2}-[0-9]{2}_[a-z]{1,2}"'
        f=( \
            'out_01-02_cl.zip' 'out_03-04_cl.zip' 'out_05-06_cl.zip' 'out_07-08_cl.zip' 'out_09-10_cl.zip' \
            'out_01-02_hc.zip' 'out_03-04_hc.zip' 'out_05-06_hc.zip' 'out_07-08_hc.zip' 'out_09-10_hc.zip' \
            'out_01-02_j.zip'  'out_03-04_j.zip'  'out_05-06_j.zip'  'out_07-08_j.zip'  'out_09-10_j.zip'  \
            'out_01-02_k.zip'  'out_03-04_k.zip'  'out_05-06_k.zip'  'out_07-08_k.zip'  'out_09-10_k.zip'  \
            'out_01-02_sc.zip' 'out_03-04_sc.zip' 'out_05-06_sc.zip' 'out_07-08_sc.zip' 'out_09-10_sc.zip' \
            'out_01-02_tc.zip' 'out_03-04_tc.zip' 'out_05-06_tc.zip' 'out_07-08_tc.zip' 'out_09-10_tc.zip' \
        )
        l=('CL' 'HC' 'J' 'K' 'SC' 'TC')
        c=7 # 0-7-9
        d='128m'
        PATH="$GITHUB_WORKSPACE"/bin:"$PATH"

        for i in $(seq 0 $((${#f[@]}-1)))
        do
            url=$(curl -H "Authorization: Bearer $t" \
                -L "https://api.github.com/repos/hongshawo/Sarasa-Gothic/actions/runs/${rid[$i]}/artifacts" | \
                jq -j ".artifacts | map(select(.name | test($re) ))[] | .archive_download_url")
            echo "archive_download_url: $url"
            curl -H "Authorization: Bearer $t" -o "${f[$i]}" -L "$url"
        done

        for n in "${f[@]}"
        do
            unzip -n "$n"
        done

        dir=$PWD

        cd TTF
        for e in "${l[@]}"
        do
            7zz a -mx=$c -md="$d" -bb3 "$dir/SarasaStatic$e-TTF-$SV.7z" SarasaStatic"$e"-*.ttf
            7zz a -mx=$c -md="$d" -bb3 "$dir/SarasaStaticSlab$e-TTF-$SV.7z" SarasaStaticSlab"$e"-*.ttf
        done
        cd "$dir"

        cd TTF-Unhinted
        for e in "${l[@]}"
        do
           7zz a -mx=$c -md="$d" -bb3 "$dir/SarasaStatic$e-TTF-Unhinted-$SV.7z" SarasaStatic"$e"-*.ttf
           7zz a -mx=$c -md="$d" -bb3 "$dir/SarasaStaticSlab$e-TTF-Unhinted-$SV.7z" SarasaStaticSlab"$e"-*.ttf
        done
        cd "$dir"
    - run: |
        echo '<ls>'; ls -aFl
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SarasaStaticCL-TTF-${{ env.SV }}.7z
        path: SarasaStaticCL-TTF-${{ env.SV }}.7z
        if-no-files-found: warn
        compression-level: 0
    - name: Upload Artifacts 2
      uses: actions/upload-artifact@v4
      with:
        name: SarasaStaticSlabCL-TTF-${{ env.SV }}.7z
        path: SarasaStaticSlabCL-TTF-${{ env.SV }}.7z
        if-no-files-found: warn
        compression-level: 0
    - name: Upload Artifacts 3
      uses: actions/upload-artifact@v4
      with:
        name: SarasaStaticCL-TTF-Unhinted-${{ env.SV }}.7z
        path: SarasaStaticCL-TTF-Unhinted-${{ env.SV }}.7z
